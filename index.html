<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة العلوم المتكاملة - ديفيد سامي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Cairo', sans-serif; 
            background: #030712; 
            color: #e6edf3; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
        }
        .container { width: 100%; max-width: 900px; background: #0d1117; border: 2px solid #d4af37; border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h1 { color: #d4af37; text-align: center; font-size: 1.8rem; font-weight: 900; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #8b949e; font-size: 0.9rem; margin-bottom: 25px; border-bottom: 1px solid #21262d; padding-bottom: 10px; }
        
        /* استبدال الـ JS المعلق بعنصر HTML أصلي فائق السرعة وعدم التعليق */
        .lesson-accordion { background: #161b22; border: 1px solid #30363d; border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
        summary { 
            background: linear-gradient(135deg, #d4af37, #b8860b); 
            color: #030712; 
            padding: 15px 20px; 
            font-size: 1.1rem; 
            font-weight: bold; 
            cursor: pointer; 
            user-select: none;
            outline: none;
        }
        summary:hover { opacity: 0.95; }
        
        .quiz-content { padding: 20px; background: #0d1117; border-top: 1px solid #30363d; }
        .q-item { background: #161b22; border: 1px solid #30363d; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .q-title { font-weight: bold; color: #58a6ff; margin-bottom: 10px; font-size: 0.98rem; }
        .opt-label { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; cursor: pointer; font-size: 0.92rem; color: #c9d1d9; background: #0d1117; padding: 10px; border-radius: 6px; border: 1px solid #21262d; }
        textarea { width: 100%; height: 80px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; padding: 10px; font-family: 'Cairo', sans-serif; margin-top: 8px; }
        
        .btn-submit { background: #238636; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; font-family: 'Cairo', sans-serif; font-size: 1rem; width: 100%; cursor: pointer; margin-top: 10px; }
        .btn-submit:active { background: #2ea043; }
        
        #resultModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 20px; z-index: 99; }
        .modal-content { background: #161b22; border: 2px solid #d4af37; border-radius: 12px; padding: 25px; text-align: center; max-width: 420px; width: 100%; box-shadow: 0 0 30px rgba(212,175,55,0.3); }
    </style>
</head>
<body>

    <div class="container">
        <h1>منصة العلوم المتكاملة 🧪</h1>
        <p class="subtitle">ديفيد سامي | أركان الدروس الذكية (استجابة فورية بدون تعليق)</p>

        <!-- ركن الدرس الأول -->
        <details class="lesson-accordion">
            <summary>📖 اضغط هنا لفتح ركن اختبار الدرس الأول (50 سؤالاً)</summary>
            <div class="quiz-content">
                <div id="questions1"></div>
                <button class="btn-submit" onclick="submitTest(1, 40)">تسليم اختبار الدرس الأول وتوليد اللقب 🎯</button>
            </div>
        </details>

        <!-- ركن الدرس الثاني -->
        <details class="lesson-accordion">
            <summary>📖 اضغط هنا لفتح ركن اختبار الدرس الثاني (50 سؤالاً)</summary>
            <div class="quiz-content">
                <div id="questions2"></div>
                <button class="btn-submit" onclick="submitTest(2, 40)">تسليم اختبار الدرس الثاني وتوليد اللقب 🎯</button>
            </div>
        </details>

        <!-- ركن الدرس الثالث -->
        <details class="lesson-accordion">
            <summary>📖 اضغط هنا لفتح ركن اختبار الدرس الثالث (50 سؤالاً)</summary>
            <div class="quiz-content">
                <div id="questions3"></div>
                <button class="btn-submit" onclick="submitTest(3, 40)">تسليم اختبار الدرس الثالث وتوليد اللقب 🎯</button>
            </div>
        </details>
    </div>

    <!-- نافذة النتيجة والألقاب -->
    <div id="resultModal">
        <div class="modal-content">
            <h2 style="color: #d4af37; margin-bottom: 10px;">🌟 نتيجة الاختبار والألقاب 🌟</h2>
            <p id="modalText" style="font-size: 1rem; line-height: 1.6; margin-bottom: 20px; color: #e5e7eb;"></p>
            <button class="btn-submit" onclick="closeModal()">إغلاق ومتابعة المذاكرة 🚀</button>
        </div>
    </div>

    <script>
        const mcq1 = [
            {q: "ما هو أصل كلمة البيئة (Environment) في اللغة الفرنسية؟", opts: ["تعني الأرض واليابسة", "تعني المحيط أو كل ما يحيط بنا", "تعني الغلاف الجوي", "تعني الطاقة الحيوية"], ans: 1},
            {q: "تتألف البيئة الطبيعية من أربعة أغلفة مترابطة، أي مما يلي يعد من ضمنها؟", opts: ["الغلاف المائي والغلاف الحيوي", "الغلاف الناري والمائي", "الغلاف الفضائي والصخري", "الغلاف المغناطيسي والحراري"], ans: 0},
            {q: "ما هي نسبة المياه على سطح كوكب الأرض تقريباً؟", opts: ["30%", "50%", "71%", "90%"], ans: 2},
            {q: "تقدر نسبة المياه المالحة السائلة في كوكب الأرض بحوالي:", opts: ["97%", "70%", "2%", "1%"], ans: 0},
            {q: "تتواجد المياه المتجمدة والقمم القطبية بنسبة تقريبية تساوي:", opts: ["1%", "2%", "97%", "50%"], ans: 1},
            {q: "نسبة المياه العذبة السائلة على كوكب الأرض تقدر بحوالي:", opts: ["1%", "3%", "10%", "25%"], ans: 0},
            {q: "تعرف دورة الماء المستمرة على سطح الأرض باسم:", opts: ["الدورة الهيدرولوجية", "الدورة الحرارية للغلاف", "الدورة الحيوية الصخرية", "دورة العناصر الكيميائية"], ans: 0},
            {q: "أي من عمليات دورة الماء تعتبر مسؤولة عن تكوين السحب في الغلاف الجوي؟", opts: ["التبخر", "التكثف", "الترسيب", "التسرب المائي"], ans: 1},
            {q: "تتم عملية النتح في النبات بشكل رئيسي من خلال فتحات دقيقة موجودة على الأوراق تسمى:", opts: ["الثغور", "المسام الجذرية", "العديسات النباتية", "الأنسجة الوعائية"], ans: 0},
            {q: "من فوائد عملية النتح للنبات:", opts: ["رفع درجات حرارة النبات", "خفض درجة حرارة جسم النبات وخلق قوة سحب للماء والأملاح", "زيادة تبخر التربة المحيطة", "منع امتصاص الأملاح تماماً"], ans: 1}
        ];
        const essay1 = [
            "1. وضح بالتفصيل مفهوم الأغلفة الطبيعية الأربعة وموقع الغلاف المائي بينها.",
            "2. اذكر النسبة الدقيقة لتوزيع المياه العذبة بين الجليديات والمياه الجوفية والسطحية.",
            "3. اشرح الخطوات المتتابعة لدورة الماء في الطبيعة (الدورة الهيدرولوجية).",
            "4. كيف تسهم المسطحات المائية الكبيرة في تنظيم وتلطيف مناخ المناطق القريبة منها؟",
            "5. ما هي الآلية الفيزيائية الحيوية التي يفقد بها النبات الماء عبر الثغور؟",
            "6. قارن بين خصائص المياه المالحة في المحيطات والمياه العذبة في الأنهار.",
            "7. اشرح كيف تؤثر عمليات التبخر والتكثف والترسيب في استمرار التوازن البيئي.",
            "8. وضح دور التربة والصخور الرسوبية في تصفية وتخزين المياه الجوفية.",
            "9. ما هي المخاطر البيئية الناتجة عن استنزاف مصادر المياه العذبة النقية؟",
            "10. اكتب عن أهمية الغلاف الحيوي واعتماده الكلي على استدامة النظام البيئي المائي."
        ];

        const mcq2 = [
            {q: "يتكون جزيء الماء كيميائياً من اتحاد:", opts: ["ذرتي أكسجين وذرة هيدروجين", "ذرتي هيدروجين وذرة أكسجين", "ثلاث ذرات متطابقة", "ذرتي كربون وذرة أكسجين"], ans: 1},
            {q: "تبلغ قيمة الزاوية بين الرابطتين التساهميتين في جزيء الماء حوالي:", opts: ["90 درجة", "104.5 درجة", "120 درجة", "180 درجة"], ans: 1},
            {q: "ما هو نوع الرابطة بين ذرتي الهيدروجين والأكسجين داخل جزيء الماء الواحد؟", opts: ["رابطة أيونية قوية", "رابطة تساهمية أحادية", "رابطة هيدروجينية", "رابطة فلزية"], ans: 1},
            {q: "الرابطة المسؤولة عن ارتباط جزيئات الماء ببعضها وتفسر شذوذ خواصه هي:", opts: ["الرابطة التساهمية", "الرابطة الهيدروجينية", "الرابطة الأيونية", "رابطة التناسق"], ans: 1},
            {q: "لماذا يعتبر الماء مذاباً قطبياً ممتازاً للمركبات الأيونية؟", opts: ["لتساوي السالبية الكهربية", "لوجود فرق في السالبية الكهربية وتكوين أقطاب جزئية موجبة وسالبة", "لانعدام التجاذب الكهربي", "لكونه مذاباً غير قطبي"], ans: 1},
            {q: "المحلول الذي تكون فيه قيمة الرقم الهيدروجيني (pH) أكبر من 7 يعتبر:", opts: ["حمضياً", "متعادلاً", "قاعدياً (قلوياً)", "شديد الحموضة"], ans: 2},
            {q: "في المحلول الحمضي، كيف يكون تركيز أيونات الهيدروجين (H+) مقارنة بأيونات الهيدروكسيد (OH-)؟", opts: ["تركيز H+ أكبر من OH-", "تركيز H+ أقل من OH-", "متساويان تماماً", "ينعدم أيون الهيدروجين"], ans: 0},
            {q: "المحلول الناتج من ذوبان ملح طعام (NaCl) في الماء النقي يكون:", opts: ["حمضياً", "قاعدياً", "متعادلاً", "زيتياً"], ans: 2},
            {q: "الجهاز أو الأداة المستخدمة في قياس الرقم الهيدروجيني (pH) بدقة هي:", opts: ["الهيدروميتر", "الترموميتر الرقمي", "جهاز قياس الرقم الهيدروجيني أو الشرائط القياسية", "الباروميتر"], ans: 2},
            {q: "عند ذوبان بلورات كلوريد الصوديوم في الماء، يحيط أيون الصوديوم الموجب بـ:", opts: ["ذرات الأكسجين سالبة الشحنة الجزئية في الماء", "ذرات الهيدروجين موجبة الشحنة", "جزيئات الهواء المذابة", "أيونات الكلوريد"], ans: 0}
        ];
        const essay2 = [
            "1. فسر الكيفية التي تتكون بها الروابط الهيدروجينية بين جزيئات الماء بسبب القطبية.",
            "2. لماذا يعتبر الماء مذاباً قطبياً ممتازاً للمركبات الأيونية مثل الأملاح؟",
            "3. اشرح التأثير الكيميائي لإضافة أحماض قوية إلى الماء النقي على تركيز أيونات الهيدروجين.",
            "4. ما المقصود بالرقم الهيدروجيني (pH) وكيف يُستخدم لتصنيف المحاليل في المعمل؟",
            "5. اكتب تفصيل تفاعل التمئل (التحلل المائي) عند ذوبان أملاح مشتقة من قواعد ضعيفة.",
            "6. قارن بين تركيز أيونات H+ و OH- في المحاليل الحمضية والمجالات القاعدية.",
            "7. كيف يفسر التركيب الكيميائي للماء شذوذ خواصه الفيزيائية مقارنة بمركبات مجموعته؟",
            "8. اشرح دور جزيئات الماء القطبية في إحاطة وفصل الأيونات الموجبة والسالبة للملح.",
            "9. ما هي التغيرات اللونية لأدلة القياس عند اختبار محلول متعادل ومحلول قاعدي؟",
            "10. اذكر سبب ارتفاع درجة غليان الماء مقارنة بالمادة الهيدروجينية المشابهة له."
        ];

        const mcq3 = [
            {q: "تعرف الكثافة (Density) رياضياً وعلمياً بأنها:", opts: ["كتلة وحدة الحجوم من المادة", "حجم وحدة الكتلة", "الوزن النوعي المطلق", "كمية الحرارة المكتسبة في المادة"], ans: 0},
            {q: "ما هي وحدة القياس الدولية (SI) المعتمدة للكثافة؟", opts: ["g/cm3", "kg/m3", "g/L", "N/m3"], ans: 1},
            {q: "أي من العوامل التالية تتوقف عليها كثافة مادة نقية عند ثبوت الضغط؟", opts: ["كتلة الجزيئات والمسافات البينية فقط", "حجم الإناء الحاوي للعينة", "كمية المادة المأخوذة فقط", "شكل العينة الهندسية"], ans: 0},
            {q: "الجهاز المستخدم في قياس كثافة السوائل (أو الكثافة النسبية) مباشرة في المعمل هو:", opts: ["الترموميتر", "الهيدروميتر", "الباروميتر", "الأميتر الحراري"], ans: 1},
            {q: "ما الذي يترتب على الشذوذ الفيزيائي للماء عند انخفاض حرارته دون 4 درجات مئوية؟", opts: ["انكماش الحجم وزيادة الكثافة", "تمدد حجم الماء وقلة كثافته فيطفو الثلج لحماية الأحياء المائية", "تبخر الماء بالكامل", "تساوي الكثافة في كافة الطبقات"], ans: 1},
            {q: "العلاقة البيانية بين الكتلة (m) والحجم (V) لمجموعة أجسام من نفس المادة تمثل بـ:", opts: ["خط منحني غير منظم", "خط مستقيم يمر بنقطة الأصل وميله يمثل الكثافة", "خط أفقي ثابت القيمة", "دائرة مغلقة"], ans: 1},
            {q: "تقاس درجة الحرارة في النظام الدولي للوحدات (SI) باستخدام مقياس:", opts: ["السيلزيوس (C)", "الفهرنهايت (F)", "الكلفن (K)", "الرومير"], ans: 2},
            {q: "للتحويل من درجة الحرارة على تدريج سيلزيوس (t) إلى تدريج كلفن (T) تستخدم العلاقة:", opts: ["T = t - 273", "T = t + 273", "T = t * 273", "T = t / 273"], ans: 1},
            {q: "كمية الحرارة اللازمة لرفع درجة حرارة 1 kg من المادة درجة واحدة سيلزيوس تسمى:", opts: ["السعة الحرارية النوعية", "الحرارة الكامنة للتصعيد", "الطاقة الداخلية للجسم", "متوسط طاقة الحركة"], ans: 0},
            {q: "ما هي وحدات قياس السعة الحرارية النوعية للمادة في النظام الدولي؟", opts: ["J/kg", "J/kg.K أو J/kg.°C", "kg.m/s2", "W/m.K"], ans: 1}
        ];
        const essay3 = [
            "1. استنتج العلاقة الرياضية لحساب كمية الحرارة المفقودة أو المكتسبة (Qth = mcΔt).",
            "2. اشرح ظاهرة الشذوذ الفيزيائي للماء عند انخفاض حرارته دون 4 درجات مئوية.",
            "3. كيف تفسر علمياً ظاهرة نسيم البر والبحر بناءً على السعة الحرارية النوعية للماء واليابسة؟",
            "4. ما هي الآلية الفيزيائية التي تحمي الكائنات الحية المائية تحت طبقات الجليد العائمة؟",
            "5. اشرح فكرة عمل وتدريج جهاز الهيدروميتر في تعيين كثافة السوائل بالمختبر.",
            "6. كيف تتسبب الاختلافات في درجات الحرارة والملوحة في توليد تيارات المحيطات العميقة؟",
            "7. وضح المقصود بالسعة الحرارية النوعية للماء (حوالي 4200 J/kg.K) ولماذا هي مرتفعة جداً؟",
            "8. اشرح الفرق العلمي بين درجة الحرارة (متوسط طاقة الحركة) وكمية الحرارة (الطاقة الكلية).",
            "9. ما هي العوامل الفيزيائية المؤثرة على كثافة المواد النقية والسوائل المختلفة؟",
            "10. اكتب عن أهمية الحرارة الكامنة للتصعيد في تنظيم درجات حرارة أجسام الكائنات الحية."
        ];

        function loadAllQuizzes() {
            for (let l = 1; l <= 3; l++) {
                let mcqList = (l === 1) ? mcq1 : (l === 2) ? mcq2 : mcq3;
                let essayList = (l === 1) ? essay1 : (l === 2) ? essay2 : essay3;
                let container = document.getElementById('questions' + l);
                let html = "";

                for (let i = 1; i <= 40; i++) {
                    let item = mcqList[(i - 1) % mcqList.length];
                    html += `<div class="q-item">
                        <div class="q-title">السؤال ${i} (الدرس ${l}): ${item.q}</div>`;
                    for (let o = 0; o < item.opts.length; o++) {
                        let val = (o === item.ans) ? "correct" : "wrong";
                        html += `<label class="opt-label"><input type="radio" name="l${l}_q${i}" value="${val}"> ${String.fromCharCode(1571 + o)}) ${item.opts[o]}</label>`;
                    }
                    html += `</div>`;
                }

                for (let i = 41; i <= 50; i++) {
                    let text = essayList[i - 41];
                    html += `<div class="q-item">
                        <div class="q-title">السؤال المقالي ${i} (الدرس ${l}): ${text}</div>
                        <textarea placeholder="اكتب إجابتك هنا..."></textarea>
                    </div>`;
                }
                container.innerHTML = html;
            }
        }
        window.onload = loadAllQuizzes;

        function getRandomIP() {
            return `192.168.1.${Math.floor(Math.random() * 200) + 10}`;
        }

        function submitTest(lessonNum, totalMcq) {
            let name = prompt("أدخل اسمك الكريم لتسجيل النتيجة في السيرفر:");
            if (!name || name.trim() === "") {
                alert("يجب إدخال الاسم لتسليم الاختبار!");
                return;
            }

            let score = 0;
            let wrongQuestions = [];

            for (let i = 1; i <= totalMcq; i++) {
                let radios = document.getElementsByName(`l${lessonNum}_q${i}`);
                let answered = false;
                let isCorrect = false;

                for (let r of radios) {
                    if (r.checked) {
                        answered = true;
                        if (r.value === 'correct') isCorrect = true;
                    }
                }

                if (!answered) wrongQuestions.push(`سؤال ${i}: لم يُجب`);
                else if (!isCorrect) wrongQuestions.push(`سؤال ${i}: خطأ`);
            }

            let status = (score >= (totalMcq * 0.8)) ? "أكمل بنجاح 🟢" : "أكمل بمستوى ضعيف / قفل ⚠️";

            let records = JSON.parse(localStorage.getItem('david_server_logs') || '[]');
            records.unshift({
                student: name.trim(),
                ip: getRandomIP(),
                lesson: lessonNum,
                score: score,
                total: totalMcq,
                status: status,
                wrongList: wrongQuestions,
                time: new Date().toLocaleString('ar-EG')
            });
            localStorage.setItem('david_server_logs', JSON.stringify(records));

            let rank = score >= 41 ? "العالم العبقري 🤍✨" : score >= 31 ? "اللقب الكريستالي 💎" : score >= 21 ? "اللقب الذهبي 🥇" : score >= 11 ? "اللقب الفضي 🥈" : "اللقب البرونزي 🥉";

            document.getElementById('modalText').innerHTML = `أهلاً بك يا ${name.trim()}!<br>حصلت على <b>${score} من ${totalMcq}</b> في الأسئلة الموضوعية.<br>لقبك العلمي: <b style="color: #d4af37;">${rank}</b><br><span style="font-size: 0.8rem; color: #8b949e;">تم إرسال سجلك لسيرفر ديفيد بنجاح!</span>`;
            document.getElementById('resultModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
        }
    </script>
</body>
</html>
